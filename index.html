        let catalog = []; let wishlist = {}; let currentView = "collection"; let currentPublisher = "全部"; let tempCoverBase64 = ""; let html5QrcodeScanner = null;

        function parseVolumes(str) {
            if (!str) return [];
            let result = new Set();
            let normalized = String(str).replace(/~/g, '-').replace(/，/g, ',');
            let parts = normalized.split(',');
            parts.forEach(part => {
                part = part.trim();
                if (part.includes('-')) {
                    let range = part.split('-');
                    let start = parseInt(range[0]); let end = parseInt(range[1]);
                    if (!isNaN(start) && !isNaN(end)) { for (let i = start; i <= end; i++) result.add(i); }
                } else {
                    let val = parseInt(part);
                    if (!isNaN(val)) result.add(val);
                    else if(part === "全" || part === "單" || part.includes("本") || part === "106") result.add(parseInt(part) || 1);
                }
            });
            return Array.from(result).sort((a, b) => a - b);
        }

        function formatVolumes(arr) {
            if (arr.length === 0) return "無持有";
            let result = []; let start = arr[0], end = arr[0];
            for (let i = 1; i < arr.length; i++) {
                if (arr[i] === end + 1) { end = arr[i]; } 
                else { result.push(start === end ? `${start}` : `${start}-${end}`); start = end = arr[i]; }
            }
            result.push(start === end ? `${start}` : `${start}-${end}`);
            return result.join(', ');
        }

        function getMissingVolumes(ownedArr, max) {
            if (!max || max <= 0) return [];
            let missing = [];
            for (let i = 1; i <= max; i++) { if (!ownedArr.includes(i)) missing.push(i); }
            return missing;
        }

        function loadData() {
            let localCat = localStorage.getItem('comic_catalog_v3');
            let localWish = localStorage.getItem('comic_wishlist_v3');
            catalog = localCat ? JSON.parse(localCat) : excelData;
            wishlist = localWish ? JSON.parse(localWish) : {};
            catalog.forEach(c => {
                if(!c.status) c.status = "連載中";
                if(!c.isbn) c.isbn = "";
            });
            saveToStorage(); updateWishlistBadge();
        }

        function saveToStorage() {
            localStorage.setItem('comic_catalog_v3', JSON.stringify(catalog));
            localStorage.setItem('comic_wishlist_v3', JSON.stringify(wishlist));
            updateWishlistBadge();
        }

        function updateWishlistBadge() {
            let totalWishItems = Object.values(wishlist).reduce((sum, arr) => sum + arr.length, 0);
            document.getElementById('wish-count').textContent = totalWishItems;
        }

        function switchView(view) {
            currentView = view;
            const colBtn = document.getElementById('view-collection-btn');
            const wishBtn = document.getElementById('view-wishlist-btn');
            const tabs = document.getElementById('tab-container');
            if (view === 'collection') {
                colBtn.className = "px-3 py-1.5 text-xs rounded font-bold bg-[#ff4757] text-white";
                wishBtn.className = "px-3 py-1.5 text-xs rounded font-bold text-gray-400";
                tabs.classList.remove('hidden');
            } else {
                wishBtn.className = "px-3 py-1.5 text-xs rounded font-bold bg-amber-500 text-white";
                colBtn.className = "px-3 py-1.5 text-xs rounded font-bold text-gray-400";
                tabs.classList.add('hidden');
            }
            renderComics();
        }

        function toggleWishlistItem(title, vol) {
            if (!wishlist[title]) wishlist[title] = [];
            if (wishlist[title].includes(vol)) {
                wishlist[title] = wishlist[title].filter(v => v !== vol);
                if (wishlist[title].length === 0) delete wishlist[title];
            } else {
                wishlist[title].push(vol); wishlist[title].sort((a,b)=>a-b);
            }
            saveToStorage(); renderComics();
        }

        function buyWishlistItem(title, vol) {
            let comic = catalog.find(c => c.title === title); if (!comic) return;
            let ownedArray = parseVolumes(comic.owned);
            if (!ownedArray.includes(vol)) {
                ownedArray.push(vol); ownedArray.sort((a,b)=>a-b);
                comic.owned = formatVolumes(ownedArray);
            }
            if (wishlist[title]) {
                wishlist[title] = wishlist[title].filter(v => v !== vol);
                if (wishlist[title].length === 0) delete wishlist[title];
            }
            saveToStorage(); renderComics();
        }

        function quickAdjust(title, direction) {
            let comic = catalog.find(c => c.title === title); if (!comic) return;
            let ownedArray = parseVolumes(comic.owned);
            if (direction === 'plus') {
                let nextVol = ownedArray.length === 0 ? 1 : Math.max(...ownedArray) + 1;
                ownedArray.push(nextVol); if (comic.max < nextVol) comic.max = nextVol;
            } else if (direction === 'minus') {
                if (ownedArray.length > 0) {
                    let maxVol = Math.max(...ownedArray); ownedArray = ownedArray.filter(v => v !== maxVol);
                }
            }
            comic.owned = formatVolumes(ownedArray); saveToStorage(); renderComics();
        }

        function exportData() {
            const dataStr = JSON.stringify({ catalog, wishlist }, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = `漫畫閣備份_${new Date().toISOString().slice(0,10)}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }

        function importData(event) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.catalog) {
                        catalog = imported.catalog; wishlist = imported.wishlist || {};
                        saveToStorage(); renderTabs(); renderComics(); alert("🎉 資料還原成功！");
                    } else { alert("檔案格式不符，無法還原"); }
                } catch (err) { alert("讀取檔案出錯，請確認是否為正確的備份 JSON 檔"); }
            };
            reader.readAsText(file);
        }

        // ================= 🛠️ 修正：高清、對比優化、專注一維碼的一鍵解碼核心 =================
        function openScanner() {
            document.getElementById('scanner-modal').classList.remove('hidden');
            document.getElementById('scanner-result').textContent = "正在啟動 720P 高清鏡頭...";
            
            // 強制設定解碼器只認得商品條碼 (EAN)，這會讓非 QRcode 的傳統線條條碼極速讀取
            html5QrcodeScanner = new Html5Qrcode("interactive", {
                formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8 ]
            });

            html5QrcodeScanner.start(
                { facingMode: "environment" }, // 強制調用後鏡頭
                { 
                    fps: 15,                     // 提升每秒掃描次數
                    qrbox: { width: 280, height: 160 }, // 針對細長條碼優化偵測盒比例
                    videoConstraints: {
                        width: { min: 640, ideal: 1280, max: 1920 }, // 🛠️ 拉高捕捉解析度
                        height: { min: 480, ideal: 720, max: 1080 }
                    }
                },
                (decodedText) => {
                    document.getElementById('scanner-result').textContent = `🎉 成功辨識 ISBN: ${decodedText}`;
                    let matched = catalog.find(c => c.isbn === decodedText);
                    setTimeout(() => {
                        closeScanner();
                        if (matched) { editComic(matched.title); } 
                        else {
                            openAddModal();
                            document.getElementById('form-isbn').value = decodedText;
                            document.getElementById('form-title').placeholder = "新發現條碼！請輸入書名";
                        }
                    }, 600);
                },
                (errorMessage) => { /* 持續背景偵測錯誤不阻斷流程 */ }
            ).catch(err => {
                document.getElementById('scanner-result').textContent = "相機初始化失敗，請確認 PWA 網址使用 https 且開啟相機權限。";
            });
        }

        function closeScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                }).catch(err => { document.getElementById('scanner-modal').classList.add('hidden'); });
            } else { document.getElementById('scanner-modal').classList.add('hidden'); }
        }

        function renderTabs() {
            const container = document.getElementById('tab-container');
            const publishers = ["全部", "東立", "尖端", "青文", "長鴻", "東販", "木馬文化"];
            container.innerHTML = ''; if (currentView !== 'collection') return;
            publishers.forEach(pub => {
                let count = pub === "全部" ? catalog.length : catalog.filter(c => c.publisher === pub).length;
                const btn = document.createElement('button');
                btn.className = `py-3 px-2 whitespace-nowrap transition-colors ${currentPublisher === pub ? 'active-tab font-bold' : 'text-gray-400'}`;
                btn.textContent = `${pub} (${count})`;
                btn.onclick = () => { currentPublisher = pub; renderTabs(); renderComics(); };
                container.appendChild(btn);
            });
        }

        function renderComics() {
            const listContainer = document.getElementById('comic-list');
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            listContainer.innerHTML = '';

            if (currentView === 'collection') {
                let filtered = catalog.filter(comic => {
                    let matchPub = currentPublisher === "全部" || comic.publisher === currentPublisher;
                    let matchSearch = comic.title.toLowerCase().includes(searchKeyword) || comic.publisher.toLowerCase().includes(searchKeyword);
                    return matchPub && matchSearch;
                });
                if (filtered.length === 0) {
                    listContainer.innerHTML = `<div class="text-gray-500 text-center py-12 col-span-full">沒有找到相關漫畫 📚</div>`; return;
                }
                filtered.forEach(comic => {
                    let ownedArray = parseVolumes(comic.owned);
                    let missingArray = getMissingVolumes(ownedArray, comic.max);
                    let isCompleted = comic.status === "已完結" && missingArray.length === 0;

                    const card = document.createElement('div');
                    card.className = "bg-[#1e1e1e] p-3 rounded-xl border border-[#2e2e2e] flex gap-3 shadow-md relative items-center";
                    let coverHtml = comic.cover 
                        ? `<img src="${comic.cover}" class="w-16 h-24 object-cover rounded shadow-inner bg-gray-800 shrink-0">`
                        : `<div class="w-16 h-24 bg-gradient-to-br from-gray-700 to-gray-800 rounded flex items-center justify-center text-[10px] text-gray-500 text-center p-1 font-bold shrink-0">No Cover</div>`;

                    let missingHtml = "";
                    if (missingArray.length > 0) {
                        missingHtml = `<p class="text-xs text-red-400 mt-0.5 font-medium">缺集 (點擊加購物車)：<br>`;
                        missingArray.slice(0, 8).forEach(v => {
                            let inWish = wishlist[comic.title] && wishlist[comic.title].includes(v);
                            missingHtml += `<span onclick="toggleWishlistItem('${comic.title}', ${v})" class="inline-block px-1.5 py-0.5 rounded text-[10px] mr-1 mt-1 cursor-pointer font-bold ${inWish ? 'bg-amber-500 text-black' : 'bg-red-500/20 text-red-300 border border-red-500/30'}">${v}</span>`;
                        });
                        if(missingArray.length > 8) missingHtml += `<span class="text-[10px] text-gray-500">...</span>`;
                        missingHtml += `</p>`;
                    } else if (comic.max) {
                        missingHtml = isCompleted 
                            ? `<p class="text-xs text-yellow-400 mt-1 font-bold flex items-center gap-1">🏆 完美全套收集 (${comic.max}集全)</p>`
                            : `<p class="text-xs text-gray-500 mt-1">✨ 當前進度已滿 (${comic.max}集)</p>`;
                    }

                    card.innerHTML = `
                        ${coverHtml}
                        <div class="flex-1 flex flex-col justify-between min-w-0 min-h-[96px] py-0.5">
                            <div>
                                <div class="flex justify-between items-start gap-1">
                                    <h3 class="text-white font-bold text-sm truncate flex items-center gap-1">
                                        ${comic.title}
                                        <span class="text-[9px] px-1 py-0.2 rounded ${comic.status === '已完結' ? 'bg-purple-900/60 text-purple-300' : 'bg-sky-900/60 text-sky-300'}">${comic.status}</span>
                                    </h3>
                                    <span class="text-[10px] bg-[#2d2d2d] text-gray-400 px-1.5 py-0.5 rounded shrink-0">${comic.publisher}</span>
                                </div>
                                <p class="text-xs text-green-400 mt-0.5 truncate">持有：${formatVolumes(ownedArray)}</p>
                                ${missingHtml}
                            </div>
                            <div class="flex justify-between items-center mt-1">
                                <div class="flex gap-2">
                                    <button onclick="editComic('${comic.title}')" class="text-[11px] text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded">修改</button>
                                </div>
                                <div class="flex items-center bg-[#2d2d2d] rounded-lg border border-[#3e3e3e] overflow-hidden">
                                    <button onclick="quickAdjust('${comic.title}', 'minus')" class="px-2 py-0.5 text-sm text-gray-400 font-bold">-</button>
                                    <span class="px-2 text-xs text-white font-mono min-w-[24px] text-center">${ownedArray.length}</span>
                                    <button onclick="quickAdjust('${comic.title}', 'plus')" class="px-2 py-0.5 text-sm text-gray-400 font-bold">+</button>
                                </div>
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            } else {
                let wishTitles = Object.keys(wishlist); let count = 0;
                wishTitles.forEach(title => {
                    if (searchKeyword && !title.toLowerCase().includes(searchKeyword)) return;
                    count++;
                    const card = document.createElement('div'); card.className = "bg-[#251f15] p-3 rounded-xl border border-amber-500/30 flex justify-between items-center shadow-md";
                    let volsHtml = wishlist[title].map(v => {
                        return `<button onclick="buyWishlistItem('${title}', ${v})" class="bg-amber-500 hover:bg-amber-400 text-black font-bold text-xs px-2.5 py-1 rounded-md shadow mr-1.5 mt-1">✓ 第 ${v} 集已購</button>`;
                    }).join('');
                    card.innerHTML = `
                        <div class="min-w-0 flex-1">
                            <h4 class="text-amber-300 font-bold text-sm truncate">🛒 ${title}</h4>
                            <p class="text-xs text-gray-400 mt-1">出門待補集數 (購買後點擊入庫)：</p>
                            <div class="flex flex-wrap mt-1">${volsHtml}</div>
                        </div>
                        <button onclick="if(confirm('取消整部待買？')){delete wishlist['${title}']; saveToStorage(); renderComics();}" class="text-xs text-red-400 bg-red-500/10 p-2 rounded ml-2">全部取消</button>
                    `;
                    listContainer.appendChild(card);
                });
                if (count === 0) { listContainer.innerHTML = `<div class="text-gray-500 text-center py-12 col-span-full">🎉 太棒了！目前沒有缺少或待買的漫畫。</div>`; }
            }
            calculateStats();
        }

        function calculateStats() {
            document.getElementById('stat-books').textContent = catalog.length;
            let totalVol = catalog.reduce((sum, comic) => sum + parseVolumes(comic.owned).length, 0);
            document.getElementById('stat-total-volumes').textContent = totalVol;
        }

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image(); img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
                    if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                    callback(compressedBase64, file.size, compressedBase64.length);
                };
            };
        }

        function openAddModal() {
            document.getElementById('modal-title').textContent = "新增漫畫收藏";
            document.getElementById('form-title').value = ""; document.getElementById('form-title').disabled = false;
            document.getElementById('form-max').value = ""; document.getElementById('form-volumes').value = "";
            document.getElementById('form-isbn').value = ""; document.getElementById('form-status').value = "連載中";
            document.getElementById('form-cover').value = ""; document.getElementById('cover-preview').classList.add('hidden');
            document.getElementById('compress-status').classList.add('hidden'); tempCoverBase64 = "";
            document.getElementById('add-modal').classList.remove('hidden');
        }

        function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

        function editComic(title) {
            let comic = catalog.find(c => c.title === title); if (!comic) return;
            document.getElementById('modal-title').textContent = "修改漫畫資料";
            document.getElementById('form-title').value = comic.title; document.getElementById('form-title').disabled = true;
            document.getElementById('form-publisher').value = comic.publisher; document.getElementById('form-status').value = comic.status || "連載中";
            document.getElementById('form-max').value = comic.max || ""; document.getElementById('form-volumes').value = comic.owned;
            document.getElementById('form-isbn').value = comic.isbn || ""; document.getElementById('compress-status').classList.add('hidden');
            
            const preview = document.getElementById('cover-preview');
            if (comic.cover) {
                preview.innerHTML = `<img src="${comic.cover}" class="w-full h-full object-cover">`; preview.classList.remove('hidden'); tempCoverBase64 = comic.cover;
            } else { preview.classList.add('hidden'); tempCoverBase64 = ""; }
            document.getElementById('add-modal').classList.remove('hidden');
        }

        document.getElementById('form-cover').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const statusLabel = document.getElementById('compress-status');
            statusLabel.textContent = "⚡ 圖片智慧壓縮中..."; statusLabel.className = "text-xs text-amber-400 mt-1 font-medium"; statusLabel.classList.remove('hidden');

            compressImage(file, 300, 0.6, function(compressedBase64, originalSize, compressedSize) {
                tempCoverBase64 = compressedBase64; const origKB = Math.round(originalSize / 1024); const compKB = Math.round(compressedBase64.length / 1024);
                statusLabel.textContent = `✅ 壓縮成功！${origKB}KB ➜ ${compKB}KB (節省了 ${Math.round((1 - compKB/origKB)*100)}% 空間)`;
                statusLabel.className = "text-xs text-emerald-400 mt-1 font-medium";
                const preview = document.getElementById('cover-preview'); preview.innerHTML = `<img src="${tempCoverBase64}" class="w-full h-full object-cover">`; preview.classList.remove('hidden');
            });
        });

        function saveComic() {
            const title = document.getElementById('form-title').value.trim(); const publisher = document.getElementById('form-publisher').value;
            const status = document.getElementById('form-status').value; const max = parseInt(document.getElementById('form-max').value) || 0;
            const ownedRaw = document.getElementById('form-volumes').value.trim(); const isbn = document.getElementById('form-isbn').value.trim();
            if (!title) { alert("請填寫漫畫書名！"); return; }

            let ownedArray = parseVolumes(ownedRaw); let formattedOwned = formatVolumes(ownedArray); let existingIndex = catalog.findIndex(c => c.title === title);
            if (existingIndex > -1) {
                catalog[existingIndex].publisher = publisher; catalog[existingIndex].status = status;
                catalog[existingIndex].max = max; catalog[existingIndex].owned = formattedOwned;
                catalog[existingIndex].cover = tempCoverBase64; catalog[existingIndex].isbn = isbn;
            } else {
                catalog.push({ title, publisher, status, max, owned: formattedOwned, cover: tempCoverBase64, isbn });
            }
            saveToStorage(); closeAddModal(); renderTabs(); renderComics();
        }

        window.onload = () => { loadData(); renderTabs(); renderComics(); };
    </script>
</body>
</html>
